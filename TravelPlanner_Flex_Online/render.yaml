
services:
  - type: web
    name: travelplanner-flex
    runtime: python
    plan: free
    region: ohio
    rootDir: TravelPlanner_Flex_Online
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: TRAVELPLANNER_HOSTED
        value: "1"
